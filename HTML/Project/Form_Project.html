<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Registration Form</title>
</head>

<body>
    <h1>University Registration Form</h1>

    <p>
        Please fill out the form below to register.
    </p>

    <hr />

    <h2>Personel Details</h2>

    <form>

        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" name="fname" placeholder="e.g. Vaibhav" required>
        <br><br>

        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" name="lname" placeholder="e.g. Kaushik" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="gender">Gender:</label>
        <br><br>
        <input type="radio" name="gender" value="Male" id="Male">
        <label for="Male">Male</label>
        <br><br>

        <input type="radio" name="gender" value="Female" id="Female">
        <label for="Female">Female</label>
        <br><br>

        <input type="radio" name="gender" value="Other" id="Other">
        <label for="Other">Other</label>
        <br><br>

        <label for="uploadfile">Upload Your Photo : </label>
        <br><br>
        <input type="file" id="uploadfile" name="file">
        <hr />

        <h2>Contact Information</h2>
        <br><br>

        <label for="email">Email : </label>
        <input type="email" name="email" id="email" placeholder="you@gmail.com" required>
        <br><br>

        <label for="phone">Phone Number : </label>
        <input type="tel" name="phonenumber" id="phone" placeholder="e.g., 9340369758" required>
        <br><br>

        <label for="address">Mailing Address : </label>
        <br><br>
        <textarea name="address" id="address" rows="4" cols="30"></textarea>

        <hr />

        <h2>Academic Information</h2>

        <label for="courses">Select Your Course : </label>
        <br><br>
        <select name="courses" id="courses" aria-label="Select Your Course">
            <option value="C++">C++</option>
            <option value="Java">Java</option>
            <option value="Python">Python</option>
            <option value="Web Development">Web Development</option>
            <option value="System Design">System Design</option>
        </select>
        <br><br>

        <label for="activities">Extracurricular Interests : </label>
        <br><br>

        <input type="checkbox" name="activities" id="sports" value="Sports">
        <label for="sports">Sports</label>
        <br><br>

        <input type="checkbox" name="activities" id="music" value="Music">
        <label for="music">Music</label>
        <br><br>

        <input type="checkbox" name="activities" id="arts" value="Arts">
        <label for="arts">Arts</label>
        <br><br>

        <input type="checkbox" name="activities" id="drama" value="Drama">
        <label for="drama">Drama</label>

        <hr/>

        <h2>Create Your Account</h2>

        <label for="password">Create a Password : </label>
        <input type="password" name="password" id="password">
        <br><br>

        <label for="security-question">Security Question : </label>

        <select name="security-question" id="security-question" aria-label="Security Question">
            <option value="What was your first pet's name?">What was your first pet's name?</option>
            <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
            <option value="What is the name of your favorite teacher?">What is the name of your favorite teacher?</option>
        </select>
        <br><br>

        <label for="answer">Security Answer : </label>
        <input type="text" name="answer" id="answer">
        <br><br>

        <input type="checkbox" id="condition" name="condition" value="Yes">
        <label for="condition">I agree to the Terms and Conditions.</label>

        <hr/>

        <input type="submit" name="submit" value="Submit">
        <input type="reset" name="reset" value="Clear Form">
    </form>
</body>

</html>
