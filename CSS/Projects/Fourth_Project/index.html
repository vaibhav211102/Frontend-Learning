<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <form>
            <h1>Login</h1>

            <div class="uname">
            <label for="username" style="display: block; color: crimson;">Username</label>
            <input type="text" name="username" id="username" placeholder="Enter you name">
            <br><br>
            </div>

            <div class="pass">
            <label for="password" style="display: block; color: crimson;">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter your password">
            <br><br>
            </div>

            <div>
                <input style="width: 100%; background-color: cornflowerblue; font-size: 20px; font-weight: 500;" type="submit" name="submit" value="Login">
            </div>

        </form>
    </div>
</body>
</html>
