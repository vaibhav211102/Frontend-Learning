<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the following information:</p>
    <hr>
    <h2>Personal Information</h2>
    <form>
        <label for="fname">First Name:</label>
        <input type="text" name="fname" id="fname" placeholder="Vaibhav" required>
        <br><br>

        <label for="lname">Last Name:</label>
        <input type="text" name="lname" id="lname" placeholder="Kaushik" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob" required>
        <br><br>

        <label for="gender">Gender:</label>
        <br>
        <input type="radio" name="gender" value="Male" id="gender-male" required>
        <label for="gender-male">Male</label>
        <br><br>
        <input type="radio" name="gender" value="Female" id="gender-female" required>
        <label for="gender-female">Female</label>
        <br><br>
        <input type="radio" name="gender" value="Other" id="gender-other" required>
        <label for="gender-other">Other</label>
        <br><br>

        <label for="photo">Upload your Picture:</label>
        <br><br>
        <input type="file" name="file" id="photo">

        <hr>

        <h2>Contact Information</h2>
        
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="you@gmail.com" required>
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" name="phone" id="phone" placeholder="9874538333" required>
        <br><br>

        <label for="address">Mailing Address:</label>
        <br>
        <textarea name="address" id="address" rows="3" cols="20"></textarea>

        <hr>

        <h2>Academic Information</h2>

        <label for="course">Course:</label>
        <select name="courses" id="course">
            <option value="C++">C++</option>
            <option value="Python">Python</option>
            <option value="Java">Java</option>
            <option value="C">C</option>
            <option value="HTML">HTML</option>
        </select>
        <br><br>
        
        <label for="activity">Extracurricular Activities:</label>
        <br>
        <input type="checkbox" name="sports" id="sports" value="Sports">
        <label for="sports">Sports</label>

        <input type="checkbox" name="music" id="music" value="Music">
        <label for="music">Music</label>

        <input type="checkbox" name="singing" id="singing" value="Singing">
        <label for="singing">Singing</label>

        <hr>

        <h2>Create Account</h2>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required>
        <br><br>

        <label for="cpassword">Confirm Password:</label>
        <input type="password" name="cpassword" id="cpassword" required>
        <br><br>

        <input type="submit" name="submit" value="Submit">
        <input type="reset" name="reset" value="Reset">

    </form>
</body>
</html>
